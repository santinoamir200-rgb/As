name: Build PS3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# bash explicito = "bash -eo pipefail": sin esto, "comando | tee log" devuelve el
# exit code de tee (0) y un build roto parece exitoso hasta que falla el empaquetado.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
    steps:
      - uses: actions/checkout@v4

      - name: Extraer el proyecto (proyecto.zip)
        run: |
          if [ -f proyecto.zip ]; then
            echo "Extrayendo proyecto.zip"
            unzip -o -q proyecto.zip
            ls
          else
            echo "No hay proyecto.zip, uso el repo tal cual"
          fi

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc g++ libelf-dev make \
            texinfo libncurses5-dev patch python3 python-is-python3 subversion wget \
            zlib1g-dev libtool libtool-bin bzip2 libgmp3-dev pkg-config libssl-dev \
            cmake ninja-build git zip unzip imagemagick file strace

      # /usr/local no es escribible por el usuario del runner: se crea y se le da
      # permiso ANTES de restaurar la cache, si no la restauracion puede fallar sin avisar.
      - name: Preparar carpeta del toolchain
        run: |
          sudo mkdir -p "$PS3DEV"
          sudo chown -R "$USER" "$PS3DEV"

      # Clave unica por corrida + restore-keys: siempre se restaura la ultima cache
      # (aunque sea parcial) y se guarda una nueva solo si algo se construyo.
      - name: Restaurar cache del toolchain ps3dev
        id: cache-ps3dev
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-ubuntu2204-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ps3dev-ubuntu2204-v3-
            ps3dev-ubuntu2204-v2
            ps3dev-

      - name: Construir toolchain ps3dev (si falta)
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          if [ -x "$PS3DEV/ppu/bin/powerpc64-ps3-elf-gcc" ] \
             && [ -x "$PS3DEV/bin/cgcomp" ] \
             && [ -f "$PSL1GHT/ppu/include/rsx/rsx.h" ]; then
            echo "Toolchain ya presente (cache). Salto."
            exit 0
          fi
          rm -rf ps3toolchain
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh
          echo "PS3DEV_DIRTY=true" >> "$GITHUB_ENV"

      - name: Construir librerias de PS3 (zlib, libpng, libjpeg)
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          PORT="$PS3DEV/portlibs/ppu"
          have_libs() {
            [ -f "$PORT/lib/libz.a" ] && [ -f "$PORT/lib/libpng.a" ] && [ -f "$PORT/lib/libjpeg.a" ] \
              && [ -f "$PORT/include/zlib.h" ] && [ -f "$PORT/include/png.h" ] && [ -f "$PORT/include/jpeglib.h" ]
          }
          if have_libs; then
            echo "zlib/libpng/libjpeg ya presentes (cache). Salto."
            exit 0
          fi
          rm -rf ps3libraries
          git clone --depth 1 https://github.com/ps3dev/ps3libraries.git
          cd ps3libraries
          echo "--- scripts disponibles ---"
          ls scripts depends 2>/dev/null | head -100
          mkdir -p build && cd build
          # mismo metodo que libraries.sh: scripts ejecutados desde build/, en orden
          for pat in zlib png jpeg; do
            for f in $(ls ../scripts/*.sh ../depends/*.sh 2>/dev/null | grep -i "$pat" | sort); do
              echo "=== $f ==="
              bash "$f"
            done
          done
          echo "--- resultado en $PORT ---"
          ls "$PORT/lib" "$PORT/include" | head -60
          have_libs || { echo "ERROR: faltan libz.a / libpng.a / libjpeg.a o sus headers en $PORT"; exit 1; }
          echo "PS3DEV_DIRTY=true" >> "$GITHUB_ENV"

      # Se guarda aunque falle algo posterior (cancelled() excluido), pero solo si
      # este run construyo algo. Asi un error en Cg o en el juego no tira 1 h de toolchain.
      - name: Guardar cache del toolchain
        if: ${{ !cancelled() && env.PS3DEV_DIRTY == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-ubuntu2204-v3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Instalar Cg Toolkit (libCg para cgcomp)
        run: |
          set -x
          CGCOMP="$PS3DEV/bin/cgcomp"
          [ -x "$CGCOMP" ] || { echo "ERROR: no existe $CGCOMP (el toolchain no instalo PSL1GHT)"; exit 1; }
          file "$CGCOMP" || true
          # cgcomp hace dlopen("libCg.so"): hace falta la libCg de la MISMA arquitectura (32 o 64 bits)
          if file "$CGCOMP" | grep -q "32-bit"; then
            TGZ=Cg-3.1_April2012_x86.tgz
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y libc6:i386 libstdc++6:i386 || true
          else
            TGZ=Cg-3.1_April2012_x86_64.tgz
          fi
          wget --tries=3 -O cg.tgz "https://developer.download.nvidia.com/cg/Cg_3.1/$TGZ" || true
          if tar -tzf cg.tgz >/dev/null 2>&1; then
            sudo tar -xzf cg.tgz -C /
          else
            echo "Fallo la descarga de NVIDIA; pruebo con apt"
            sudo add-apt-repository -y multiverse
            sudo apt-get update
            sudo apt-get install -y nvidia-cg-toolkit
          fi
          find / -name 'libCg.so*' 2>/dev/null || true
          # El tgz de NVIDIA trae OTRA libCg.so en /usr/local/Cg/examples/Trace (traceCg, un
          # wrapper que loguea todas las llamadas y se carga a si mismo). Hay que excluirla:
          # la real esta en usr/lib64 (o usr/lib en 32 bits).
          find /usr /opt -name 'libCg.so*' -not -path '*examples*' -not -path '*Trace*' 2>/dev/null || true
          LIB=""
          for c in /usr/lib64/libCg.so /usr/lib/libCg.so /usr/lib/x86_64-linux-gnu/libCg.so /usr/lib/i386-linux-gnu/libCg.so; do
            [ -f "$c" ] && { LIB="$c"; break; }
          done
          [ -n "$LIB" ] || LIB=$(find /usr /opt -name 'libCg.so' -not -path '*examples*' -not -path '*Trace*' 2>/dev/null | head -n 1)
          [ -n "$LIB" ] || { echo "ERROR: no hay libCg.so real"; exit 1; }
          echo "Usando libCg real: $LIB"
          if strings "$LIB" | grep -qi "traceCg"; then echo "ERROR: $LIB es la libreria Trace, no la real"; exit 1; fi
          # copiar libCg.so a las rutas estandar donde dlopen busca si o si
          for d in /usr/lib /usr/lib64 /usr/lib/x86_64-linux-gnu /usr/lib32 /usr/local/lib; do
            if [ -d "$d" ] && ! [ "$LIB" -ef "$d/libCg.so" ]; then sudo cp -f "$LIB" "$d/libCg.so" || true; fi
          done
          sudo ldconfig
          LDP="$(dirname "$LIB"):/usr/lib:/usr/lib64:/usr/lib32:/usr/local/lib"
          echo "LD_LIBRARY_PATH=$LDP" >> "$GITHUB_ENV"
          ldd "$LIB" || true
          # prueba real: compilar un shader antes de empezar el build
          export LD_LIBRARY_PATH="$LDP"
          mkdir -p /tmp/cgtest
          F=$(find . -name 'ps3gl_fp_tex.fcg' | head -n 1)
          [ -n "$F" ] || { echo "ERROR: no encuentro ps3gl_fp_tex.fcg en el repo"; exit 1; }
          echo "--- prueba de cgcomp ---"
          "$CGCOMP" -f "$F" /tmp/cgtest/t.fpo || {
            echo "cgcomp fallo; trazando dlopen:"
            strace -f -e trace=openat "$CGCOMP" -f "$F" /tmp/cgtest/t.fpo 2>&1 | grep -i -E "libcg|ENOENT.*cg" || true
            exit 1
          }
          ls -l /tmp/cgtest

      - name: Diagnostico del toolchain
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          ls "$PS3DEV/bin" | head -50
          which powerpc64-ps3-elf-gcc cgcomp make_self_npdrm sfo.py pkg.py fself.py sprxlinker || true
          powerpc64-ps3-elf-gcc --version | head -n 1

      - name: Compilar el juego
        run: |
          chmod +x ./*.sh
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          # -w apaga TODOS los warnings (el log se llenaba de "#pragma warning(disable:4101)"
          # y de -Wclass-memaccess, y tapaba el error real). Solo quedan los errores.
          export CFLAGS="-w" CXXFLAGS="-w"
          # pipefail viene de "shell: bash": si build_ps3.sh falla, este paso falla.
          # Todo el log va a build.log (se sube en el artefacto). En pantalla solo se
          # imprimen los errores, justo al final de ESTE paso, para que sean lo ultimo que se ve.
          if ! ./build_ps3.sh clean > build.log 2>&1; then
            echo "################ RESUMEN: TODOS LOS ERRORES (sin repetir) ################"
            grep -E " error:" build.log | sed -E 's#/home/runner/work/[^/]+/[^/]+/##' | sort -u | head -60 || true
            echo "################ BUILD FALLO: PRIMEROS ERRORES ################"
            grep -n -m 12 -B2 -A6 -E " error:|fatal error|undefined reference|FAILED:|ld returned|No such file" build.log || true
            echo "################ ULTIMAS 25 LINEAS ################"
            tail -n 25 build.log
            exit 1
          fi
          tail -n 5 build.log
          test -f build-ps3/pvz_ps3.elf

      - name: Empaquetar (.self y .pkg)
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          ./package_ps3.sh 2>&1 | tee package.log
          ls -la build-ps3/package

      # Muestra solo las primeras lineas de error de cada log: es lo que hay que pegar.
      - name: Primeros errores (solo si falla)
        if: failure()
        run: |
          for f in build.log package.log; do
            [ -f "$f" ] || continue
            echo "=============== $f ==============="
            grep -n -m 25 -A4 -E " error:|fatal error|undefined reference|FAILED:|ld returned|No such file|Error [0-9]" "$f" || tail -n 40 "$f"
          done

      - name: Subir resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-ps3
          path: |
            build-ps3/pvz_ps3.elf
            build-ps3/package/*.self
            build-ps3/package/*.pkg
            build.log
            package.log
            build-ps3/ps3gl_shaders/*
            build-ps3/.ninja_log
          if-no-files-found: warn
