name: Build PS3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
    steps:
      - uses: actions/checkout@v4

      - name: Extraer el proyecto (proyecto.zip)
        run: |
          if [ -f proyecto.zip ]; then
            echo "Extrayendo proyecto.zip"
            unzip -o -q proyecto.zip
            ls
          else
            echo "No hay proyecto.zip, uso el repo tal cual"
          fi

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc g++ libelf-dev make \
            texinfo libncurses5-dev patch python3 python-is-python3 subversion wget \
            zlib1g-dev libtool libtool-bin bzip2 libgmp3-dev pkg-config libssl-dev \
            cmake ninja-build git zip unzip imagemagick

      - name: Cache del toolchain ps3dev
        id: cache-ps3dev
        uses: actions/cache@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-ubuntu2204-v1

      - name: Construir toolchain ps3dev (solo si no hay caché)
        if: steps.cache-ps3dev.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R "$USER" /usr/local/ps3dev
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh

      - name: Instalar Cg Toolkit (libCg para cgcomp)
        run: |
          set -x
          CGCOMP="$PS3DEV/bin/cgcomp"
          file "$CGCOMP" || true
          sudo apt-get install -y file strace || true
          # cgcomp hace dlopen("libCg.so"): hay que tener la libCg de la MISMA arquitectura (32 o 64 bits)
          if file "$CGCOMP" | grep -q "32-bit"; then
            ARCH=ia32; TGZ=Cg-3.1_April2012_x86.tgz; LIBDIR=/usr/lib32
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y libc6:i386 libstdc++6:i386 || true
          else
            ARCH=x86_64; TGZ=Cg-3.1_April2012_x86_64.tgz; LIBDIR=/usr/lib64
          fi
          wget --tries=3 -O cg.tgz "https://developer.download.nvidia.com/cg/Cg_3.1/$TGZ" || true
          if tar -tzf cg.tgz >/dev/null 2>&1; then
            sudo tar -xzf cg.tgz -C /
          else
            echo "Fallo la descarga de NVIDIA; pruebo con apt"
            sudo add-apt-repository -y multiverse
            sudo apt-get update
            sudo apt-get install -y nvidia-cg-toolkit
          fi
          find / -name 'libCg.so*' 2>/dev/null
          # copiar libCg.so a las rutas estándar donde dlopen busca sí o sí
          LIB=$(find /usr /opt -name 'libCg.so' 2>/dev/null | head -n 1)
          [ -n "$LIB" ] || { echo "ERROR: no hay libCg.so"; exit 1; }
          for d in /usr/lib /usr/lib64 /usr/lib/x86_64-linux-gnu /usr/lib32 /usr/local/lib; do
            [ -d "$d" ] && sudo cp -f "$LIB" "$d/libCg.so" || true
          done
          sudo ldconfig
          echo "LD_LIBRARY_PATH=$(dirname "$LIB"):/usr/lib:/usr/lib64:/usr/lib32:/usr/local/lib" >> $GITHUB_ENV
          ldd "$LIB" || true
          # prueba real: compilar un shader antes de empezar el build
          mkdir -p /tmp/cgtest
          echo "--- prueba de cgcomp ---"
          export LD_LIBRARY_PATH="$(dirname "$LIB"):/usr/lib:/usr/lib64:/usr/lib32:$LD_LIBRARY_PATH"
          F=$(find . -name 'ps3gl_fp_tex.fcg' | head -n 1)
          "$CGCOMP" -f "$F" /tmp/cgtest/t.fpo || {
            echo "cgcomp sigue fallando; trazando dlopen:"
            strace -f -e trace=openat "$CGCOMP" -f "$F" /tmp/cgtest/t.fpo 2>&1 | grep -i -E "libcg|ENOENT.*cg" || true
            exit 1
          }
          ls -l /tmp/cgtest

      - name: Diagnostico del toolchain
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          ls "$PS3DEV/bin" | head -50
          which powerpc64-ps3-elf-gcc cgcomp make_self_npdrm sfo.py pkg.py fself.py || true

      - name: Compilar el juego
        run: |
          chmod +x ./*.sh
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          ./build_ps3.sh clean 2>&1 | tee build.log

      - name: Empaquetar (.self y .pkg)
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          ./package_ps3.sh 2>&1 | tee package.log
          ls -la build-ps3/package || true

      - name: Subir resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-ps3
          path: |
            build-ps3/pvz_ps3.elf
            build-ps3/package/*.self
            build-ps3/package/*.pkg
            build.log
            build-ps3/ps3gl_shaders/*
            build-ps3/.ninja_log
            package.log
          if-no-files-found: warn
